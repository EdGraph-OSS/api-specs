name: Commit changes

on:
  workflow_call:

jobs:
  update-version-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Pushes go out as the edgraph-api-specs-publisher app, which has a bypass on
      # the branch rulesets. GITHUB_TOKEN direct pushes to main are blocked (rulesets)
      # and the enterprise policy does not allow Actions to create PRs, so the app
      # token is the sanctioned path for this automation.
      - name: Mint publisher app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          owner: EdGraph-OSS
          repositories: api-specs

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18

      - name: "Update EdGraph Platform SDK Version"
        run: |
          node ./sdk-generation-configuration/update-version.js
          node ./.github/workflows/read-version.js

      - name: "Commit Version Update: ${{ env.version }}"
        run: |
          git config user.name "edgraph-api-specs-publisher[bot]"
          git config user.email "edgraph-api-specs-publisher[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain sdk-generation-configuration)" ]]; then
            git add sdk-generation-configuration
            git commit -m "chore(sdk-generation-configuration): update version"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No Version changes to commit"
          fi
